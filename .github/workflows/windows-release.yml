name: Crear ejecutable de Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de compilación
        run: python -m pip install -r requirements-build.txt

      - name: Incluir la versión de esta Release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Set-Content -Path version.py -Value "__version__ = `"$version`"" -Encoding utf8

      - name: Compilar Menu.exe
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm menu_windows.spec

      - name: Comprobar arranque del ejecutable
        shell: pwsh
        run: |
          $informe = Join-Path $env:RUNNER_TEMP 'menu-arranque.json'
          $proceso = Start-Process -FilePath '.\dist\Menu.exe' -ArgumentList @('--comprobar-arranque', "`"$informe`"") -WindowStyle Hidden -PassThru
          if (-not $proceso.WaitForExit(60000)) {
            $proceso.Kill()
            throw 'El ejecutable no terminó la comprobación de arranque.'
          }
          if ($proceso.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $informe)) {
            throw 'El ejecutable no pudo iniciar Qt.'
          }
          $resultado = Get-Content -LiteralPath $informe -Raw | ConvertFrom-Json
          if (-not $resultado.ok) { throw $resultado.error }
          Get-Content -LiteralPath $informe

      - name: Publicar ejecutable en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Menu.exe
