name: Menu completo Android
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: menu-android-${{ github.sha }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["aarch64","x86_64"]' || '["aarch64"]') }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool libtool-bin libltdl-dev pkg-config cmake ninja-build libffi-dev libssl-dev zlib1g-dev libncurses-dev libtinfo6 libgl1 libegl1 libxkbcommon0 xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxkbcommon-x11-0 libxcb-xinput0 libxcb-xinerama0 libxcb-util1 libx11-xcb1 libxcb-shape0 libxcb-xfixes0 libxcb-randr0 libxcb-sync1
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.12.0 buildozer==1.6.0 cython==0.29.33 setuptools jinja2 pkginfo tqdm
      - name: Android SDK y NDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Pruebas de la aplicación completa
        run: QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb xvfb-run -a python -X faulthandler AndroidCompleto/herramientas/run_tests.py
      - name: Compilar APK autónomo ${{ matrix.arch }}
        run: |
          set -o pipefail
          python AndroidCompleto/herramientas/build_menu_android.py --arch ${{ matrix.arch }} --destination "$RUNNER_TEMP/menu-android" --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/28.2.13676358" 2>&1 | tee android-build.log
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tisamar-Menu-Android-${{ matrix.arch }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Permisos para emulador
        if: matrix.arch == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar arranque en teléfono Android
        if: matrix.arch == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apk-output/Tisamar-Menu-x86_64-debug.apk
            adb logcat -c
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell monkey -p pa.tisamar.menu 1
            sleep 20
            adb shell pidof pa.tisamar.menu
            adb exec-out screencap -p > android-login.png
            adb shell am force-stop pa.tisamar.menu
            adb shell run-as pa.tisamar.menu cat files/app/main.py > qa-main.py
            python AndroidCompleto/herramientas/qa_prepare_login.py
            adb push qa-main.py /data/local/tmp/qa-main.py
            adb shell run-as pa.tisamar.menu cp /data/local/tmp/qa-main.py files/app/main.py
            adb shell monkey -p pa.tisamar.menu 1
            sleep 20
            adb exec-out screencap -p > android-inicio.png
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 4
            adb exec-out screencap -p > android-horizontal.png
            adb logcat -d > android-runtime.log
            grep "ANDROID_QA_LOGIN True PAGE PaginaInicio" android-runtime.log
            grep "ANDROID_QA_HOME_FITS True" android-runtime.log
      - name: Guardar pruebas en emulador
        if: always() && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: Prueba-Menu-Android
          path: |
            android-login.png
            android-inicio.png
            android-horizontal.png
            android-runtime.log
          if-no-files-found: ignore
      - name: Guardar diagnóstico de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Menu-Android-${{ matrix.arch }}
          path: |
            android-build.log
            ${{ runner.temp }}/menu-android/buildozer.spec
            ${{ runner.temp }}/menu-android/pysidedeploy.spec
          if-no-files-found: ignore
