name: Verificar navegación Android
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/verificar-android.yml']
permissions:
  contents: read
  actions: read
jobs:
  telefono:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: gh run download 43577268044 -n Tisamar-Menu-Android-x86_64 -D apk
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apk/Tisamar-Menu-x86_64-debug.apk
            adb logcat -c
            adb shell monkey -p pa.tisamar.menu 1
            sleep 25
            adb shell input tap 920 640
            sleep 2
            adb shell input tap 400 1470
            sleep 2
            adb shell input tap 60 2000
            sleep 1
            adb shell input tap 108 1840
            sleep 1
            adb shell input tap 324 1840
            sleep 1
            adb shell input tap 918 2000
            sleep 1
            adb shell input tap 810 1680
            sleep 1
            adb shell input tap 810 2000
            sleep 1
            adb shell input keyevent 4
            sleep 3
            adb exec-out screencap -p > antes.png
            adb shell input tap 500 1730
            sleep 10
            adb exec-out screencap -p > despues.png
            adb logcat -d > runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Navegacion-Android
          path: |
            *.png
            runtime.log
