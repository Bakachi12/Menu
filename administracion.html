<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tisamar · Administración</title><style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;color:#eaf3ff;background:#081222}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#081222d9,#081222ed),url('/fondo_bar.png') center/cover fixed}button,input,select{font:inherit;border:1px solid #277c9e;border-radius:9px;padding:10px 14px;background:#10263b;color:#eaf3ff}button{cursor:pointer}button:hover,button.active{border-color:#f34bcb;background:#20324d}button.primary{background:#23d7f4;color:#061625;font-weight:700}button:disabled{opacity:.5;cursor:default}input,select{max-width:100%;min-width:0}label{display:grid;gap:6px;font-size:14px;color:#aac2d9}h1,h2,h3{margin:0 0 16px}h1{font-size:26px;color:#79eaff}h2{font-size:21px;color:#79eaff}p{line-height:1.5}.muted{color:#a8bad0;font-size:14px}.error{color:#ffaaa7}#login{min-height:100vh;display:grid;place-items:center}#login form{width:min(420px,90vw);padding:30px;background:#101e34;border:1px solid #23d7f4;border-radius:18px;display:grid;gap:18px}#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:#0e1e2a;padding:24px 14px;border-right:1px solid #25475e;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh}aside button{text-align:left}aside .identity{margin-top:auto;font-size:14px;color:#79eaff}main{padding:28px;min-width:0}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}#dates,.actions{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card,.panel{background:#101f34;border:1px solid #25475e;border-radius:14px;padding:20px;margin-bottom:18px}.card strong{display:block;font-size:28px;color:#79eaff;margin-top:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #284056}th{color:#79eaff;background:#112e45}td{vertical-align:middle}tbody tr:nth-child(even){background:#13243a}td.money,th.money{text-align:right;white-space:nowrap}.sheet{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px;border:1px solid #27516c;border-radius:10px;margin:10px 0}dialog{background:#101e34;color:#eaf3ff;border:1px solid #23d7f4;border-radius:14px;width:min(1400px,96vw);max-height:94vh;padding:24px}dialog::backdrop{background:#020711ce}.close{float:right}details{margin-top:18px}summary{cursor:pointer;color:#79eaff}.price{width:100px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.total td{font-weight:bold;color:#79eaff;border-top:2px solid #23d7f4}[hidden]{display:none!important}@media(max-width:800px){#app{grid-template-columns:160px 1fr}main{padding:16px}aside{padding:16px 8px}aside button{padding:10px 8px;font-size:14px}.cards{grid-template-columns:1fr}}
</style></head><body><section id="login"><form id="loginform"><div class="muted">TISAMAR · TERMINAL ADMIN</div><h1>Administración</h1><p class="muted">Inicia con una cuenta de administrador. La sesión del cajero permanece activa.</p><label>Usuario<input id="user" autocomplete="username" required maxlength="128"></label><label>Contraseña<input id="pass" type="password" autocomplete="current-password" required maxlength="128"></label><button class="primary">Iniciar sesión</button><p id="loginerror" class="error" role="alert"></p></form></section>
<section id="app" hidden><aside><h2>Tisamar</h2><span class="muted">Administración</span><nav id="nav" style="display:grid;gap:10px"></nav><span class="identity" id="identity"></span><button id="logout">Cerrar esta sesión</button></aside><main><header><h1 id="title">Resumen</h1><button id="refresh">Actualizar</button></header><div id="dates"><label>Desde<input id="from" type="date"></label><label>Hasta<input id="to" type="date"></label><button id="apply">Consultar fechas</button></div><p id="status" class="muted" role="status"></p><section id="content"></section></main></section>
<dialog id="sheet"><button class="close" id="closesheet">Cerrar detalle</button><h2 id="sheettitle"></h2><div id="sheetcontent"></div></dialog>
<script>
'use strict';const $=id=>document.getElementById(id);let link=location.hash.slice(1)||sessionStorage.getItem('admin-link')||'',token=sessionStorage.getItem('admin-session')||'',data=null,view='resumen',loading=false;
if(link){sessionStorage.setItem('admin-link',link);history.replaceState(null,'',location.pathname)}
const views={resumen:'Resumen',cobros:'Ventas y cobros',inventario:'Inventario',hojas:'Hojas de inventario',productos:'Productos y precios',usuarios:'Usuarios'};
const money=c=>'B/. '+(c/100).toFixed(2);function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function btn(text,fn,cls){const b=node('button',text,cls);b.type='button';b.onclick=fn;return b}
function table(headers,rows){const wrap=node('div',undefined,'tablewrap'),t=node('table'),head=node('tr'),body=node('tbody');for(const h of headers)head.append(node('th',h));const thead=node('thead');thead.append(head);t.append(thead,body);for(const row of rows){const tr=node('tr');for(const value of row){const td=node('td');if(value instanceof Node)td.append(value);else td.textContent=value??'';tr.append(td)}body.append(tr)}if(!rows.length){const td=node('td','No hay registros para mostrar.');td.colSpan=headers.length;const tr=node('tr');tr.append(td);body.append(tr)}wrap.append(t);return wrap}
async function api(path,body){const r=await fetch('/api/admin/'+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+link,'X-Sesion':token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const result=await r.json();if(!r.ok){if(r.status===401){token='';sessionStorage.removeItem('admin-session');$('app').hidden=true;$('login').hidden=false}throw Error(result.error||'No se pudo completar la operación.')}return result}
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':'muted'}
async function refresh(){if(loading)return;loading=true;$('refresh').disabled=true;try{data=await api('panel?desde='+encodeURIComponent($('from').value)+'&hasta='+encodeURIComponent($('to').value));$('login').hidden=true;$('app').hidden=false;$('identity').textContent=data.usuario+' · Admin';render();status('Conectado a la PC de caja · Actualizado '+new Date().toLocaleTimeString())}catch(e){status(e.message,true);$('loginerror').textContent=e.message}finally{loading=false;$('refresh').disabled=false}}
async function change(path,body){try{const result=await api(path,body);await refresh();status(result.mensaje)}catch(e){status(e.message,true)}}
function panel(title){const p=node('section',undefined,'panel');p.append(node('h2',title));$('content').append(p);return p}
function render(){if(!data)return;$('content').replaceChildren();$('title').textContent=views[view];for(const b of $('nav').children)b.classList.toggle('active',b.dataset.view===view);
if(view==='resumen'){const cards=node('div',undefined,'cards');for(const [label,value] of [['Vendido en las fechas',money(data.total_centimos)],['Cobros registrados',data.ventas.length],['Cuentas abiertas',data.cuentas_abiertas],['Usuario activo en caja',data.caja_usuario?data.caja_usuario.nombre:data.turno?data.turno.usuario:'Sin sesión activa']]){const c=node('div',undefined,'card');c.append(node('span',label),node('strong',String(value)));cards.append(c)}$('content').append(cards);panel('Formas de pago').append(table(['Forma de pago','Importe'],Object.entries(data.pagos).map(([k,v])=>[k,money(v)])));panel('Caja central').append(node('p','Este panel tiene su propia sesión de Admin. Los cobros siguen realizándose en la terminal de caja.','muted'))}
if(view==='cobros')panel('Ventas del intervalo').append(table(['Fecha','Cajero','Cuenta','Cliente','Pago','Total'],data.ventas.map(v=>[v.fecha,v.cajero,v.mesa,v.cliente,v.metodo,money(v.total_centimos)])));
if(view==='inventario'){const p=panel('Registrar inventario recibido en almacén'),f=node('form',undefined,'actions'),select=node('select');for(const item of data.inventario){const o=node('option',item.nombre+' · '+item.categoria);o.value=item.id;select.append(o)}const q=node('input');q.type='number';q.min='1';q.max='999999';q.step='1';q.required=true;q.placeholder='Unidades recibidas';const save=node('button','Registrar entrada','primary');f.append(select,q,save);f.onsubmit=e=>{e.preventDefault();change('entrada',{producto_id:Number(select.value),cantidad:Number(q.value)})};p.append(f,node('p','Las entradas se registran en la base central y quedan en el historial de movimientos.','muted'));panel('Existencias de almacén').append(table(['Producto','Categoría','Disponible'],data.inventario.map(p=>[p.nombre,p.categoria,p.cantidad])))}
if(view==='hojas'){const p=panel('Hojas · Más recientes primero'),ids=new Set();for(const f of data.hojas){if(ids.has(f.turno_id))continue;ids.add(f.turno_id);const row=node('div',undefined,'sheet'),label=node('div');label.append(node('strong',f.cajero),node('div',(f.asignacion_fecha||'')+' · '+f.estado,'muted'));row.append(label,btn('Ver hoja',()=>openSheet(f.turno_id)));p.append(row)}if(!ids.size)p.append(node('p','No hay hojas en este intervalo.','muted'))}
if(view==='productos')panel('Precios del catálogo').append(table(['Producto','Categoría','Menú','Precio actual','Nuevo precio',''],data.productos.map(p=>{const input=node('input',undefined,'price');input.type='number';input.min='0.01';input.max='999999';input.step='0.01';input.value=(p.precio_centimos/100).toFixed(2);return [p.nombre+(p.activo?'':' · Retirado'),p.categoria,p.seccion,money(p.precio_centimos),input,btn('Guardar',()=>change('precio',{producto_id:p.id,precio_anterior:p.precio_centimos,precio:input.value}))]})));
if(view==='usuarios'){const p=panel('Crear usuario'),f=node('form',undefined,'formgrid'),fields={};for(const [key,label,type] of [['nombre','Nombre completo','text'],['usuario','Usuario','text'],['password','Contraseña inicial','password']]){const l=node('label',label),i=node('input');i.type=type;i.required=true;i.maxLength=key==='password'?128:50;l.append(i);f.append(l);fields[key]=i}const roles=node('select');for(const [v,t] of [['mesas','Cajero'],['venta_libre','Venta libre'],['mesero','Mesero'],['cocinero','Cocinero'],['admin','Administrador']]){const o=node('option',t);o.value=v;roles.append(o)}f.append(roles,node('button','Crear usuario','primary'));f.onsubmit=e=>{e.preventDefault();const body={rol:roles.value};for(const [k,i] of Object.entries(fields))body[k]=i.value;change('usuario',body);fields.password.value=''};p.append(f);panel('Personal registrado').append(table(['Nombre','Usuario','Perfil'],data.usuarios.map(u=>[u.nombre,u.usuario,u.rol])))}
}
async function openSheet(id){try{const d=await api('hoja/'+id),r=d.resumen;$('sheettitle').textContent='Hoja de '+d.filas[0].cajero;const rows=d.filas.map(f=>[f.producto,f.recibida,f.agregada,f.vendida,money(f.dinero_centimos),f.entregada,f.faltante??'No contado',f.sobrante??'No contado']);if(r.cocina_unidades)rows.push(['COCINA · Resumen','','',r.cocina_unidades,money(r.cocina_centimos),'','','']);for(const [k,v] of Object.entries(r.importes))rows.push(['','','',k,money(v),'','','']);rows.push(['TOTAL VENDIDO','','',d.filas.reduce((s,f)=>s+f.vendida,0)+r.cocina_unidades,money(d.filas.reduce((s,f)=>s+f.dinero_centimos,0)+r.cocina_centimos),'','','']);$('sheetcontent').replaceChildren(table(['Producto','Recibido','Agregado','Vendido','Importe','Entregado / Saldo','Faltantes','Sobrantes'],rows));if(r.ambiguas)$('sheetcontent').append(node('p','Existen cobros antiguos sin asociación precisa a esta hoja.','error'));if(r.cocina.length){const detail=node('details');detail.append(node('summary','Ver cocina detallada'),table(['Plato','Preparación','Acompañamiento','Unidades','Importe'],r.cocina.map(p=>[p.nombre,p.preparacion,[p.acompanamiento,p.extra].filter(Boolean).join(' / '),p.unidades,money(p.centimos)])));$('sheetcontent').append(detail)}$('sheet').showModal()}catch(e){status(e.message,true)}}
for(const [key,title] of Object.entries(views)){const b=btn(title,()=>{view=key;render()});b.dataset.view=key;$('nav').append(b)}
const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());$('from').value=$('to').value=today.toISOString().slice(0,10);
$('loginform').onsubmit=async e=>{e.preventDefault();try{if(!link)throw Error('Abre el enlace de administración generado en la PC de caja.');const result=await api('login',{usuario:$('user').value,password:$('pass').value});token=result.token;sessionStorage.setItem('admin-session',token);await refresh()}catch(e){$('loginerror').textContent=e.message}finally{$('pass').value=''}};
$('logout').onclick=async()=>{try{await api('logout',{})}finally{token='';sessionStorage.removeItem('admin-session');data=null;$('sheet').close();$('app').hidden=true;$('login').hidden=false}};
$('refresh').onclick=$('apply').onclick=refresh;$('closesheet').onclick=()=>$('sheet').close();setInterval(()=>{if(token&&['resumen','cobros','hojas'].includes(view)&&!$('sheet').open)refresh()},10000);if(token)refresh();
</script></body></html>
